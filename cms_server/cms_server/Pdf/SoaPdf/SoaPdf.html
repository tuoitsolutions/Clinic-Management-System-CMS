<html>
<head>
    <style>
    </style>
</head>
<body>
    <div class='header'>
        <div class='brand-main-info'>
            <img src='data:image/png;base64,{brand_logo}' class='brand-logo' />
            <div class='brand-name'>
                {brand_name}
            </div>
        </div>
        <div class='brand-sub-info'>
            <div class='sub-info-item' style='margin-bottom: 10px;'>
                {brand_address}
            </div>
            <div class='sub-info-item'>
                Phone: {brand_phone}
            </div>
            <div class='sub-info-item'>
                Email Address: {brand_email}
            </div>
        </div>
    </div>
    <div class='document-title'>
        Statement of Account
    </div>

    <table>
        <thead style='display: table-header-group;'>
            <tr>
                <td>
                    Slip #
                </td>
                <td>
                    Customer
                </td>
                <td>
                    Type
                </td>
                <td>
                    Charge
                </td>
                <td>
                    Menu
                </td>
                <td align='right'>
                    Unit Price
                </td>
                <td align='right'>
                    Qty
                </td>
                <td>
                    Disc. Type
                </td>
                <td>
                    Disc. Rate
                </td>
                <td align='right'>
                    Disc. Amount
                </td>
                <td>
                    VAT Rate
                </td>
                <td align='right'>
                    VAT Amount
                </td>
                <td align='right'>
                    Total Price
                </td>
                <td align='right'>
                    Net Price
                </td>
                <td>
                    Transacted On
                </td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <div>
        <div class="signature-name">Dr. Joemar Quinkito</div>
    </div>

    <div class='grid' style='margin: 2em;'>
        <div class='col-4' style='justify-content: end; justify-self: end'>
            <div class='grid'>
                <div class='signature-name'>Dr. Joemar Quinkito</div>
            </div>
        </div>
    </div>

</body>
</html>
